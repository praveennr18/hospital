services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: healthcare_db
    environment:
      POSTGRES_DB: healthcare_pro_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - healthcare_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend Django Application
  backend:
    build:
      context: ./backend/healthcare_pro
      dockerfile: Dockerfile
    container_name: healthcare_backend
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-dev-key-change-in-production
      - DB_NAME=healthcare_pro_db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=*
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
    depends_on:
      db:
        condition: service_healthy
    networks:
      - healthcare_network

  # Frontend React Application
  frontend:
    build:
      context: ./frontend/react_app
      dockerfile: Dockerfile
    container_name: healthcare_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - healthcare_network
    environment:
      - REACT_APP_API_URL=http://localhost:8000

  # Nginx Reverse Proxy (Single Entry Point)
  nginx:
    image: nginx:alpine
    container_name: healthcare_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - healthcare_network

volumes:
  postgres_data:

networks:
  healthcare_network:
    driver: bridge
